<!DOCTYPE html>
<html>
<head>
    <title>Pyodide Import Test</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
</head>
<body>
    <h1>Pyodide Import Test</h1>
    <button onclick="runTest()">Run Test</button>
    <pre id="output"></pre>

    <script>
        let pyodide = null;
        let output = document.getElementById('output');

        function log(msg) {
            output.textContent += msg + '\n';
            console.log(msg);
        }

        async function loadPyodide() {
            log('Loading Pyodide...');
            pyodide = await loadPyodide({
                indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.24.1/full/'
            });
            log('✓ Pyodide loaded');

            // Load numpy
            log('Loading numpy...');
            await pyodide.loadPackage(['numpy']);
            log('✓ numpy loaded');

            // Setup filesystem
            const fs = pyodide.FS;

            // List of critical files
            const files = [
                'src/__init__.py',
                'src/constants.py',
                'src/core/__init__.py',
                'src/core/modules/__init__.py',
                'src/core/modules/pressure.py',
                'src/core/modules/flow.py',
                'src/core/modules/thermal.py',
                'src/core/modules/environmental.py',
                'src/core/processors/__init__.py',
                'src/core/processors/calculation_processor.py',
                'src/core/validation/__init__.py',
                'src/core/data/__init__.py',
                'src/core/kinetics/__init__.py',
                'src/core/kinetics/viscosity_conversion.py',
                'src/core/kinetics/reaction_kinetics.py',
                'src/core/kinetics/thermal_reaction.py',
                'src/core/kinetics/foam_kinetics.py',
            ];

            log(`\nLoading ${files.length} Python files...`);
            let loaded = 0;
            let failed = 0;

            for (const file of files) {
                try {
                    const response = await fetch(`/python/${file}`);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const content = await response.text();

                    // Create directory if needed
                    const dirPath = '/' + file.substring(0, file.lastIndexOf('/'));
                    if (!fs.analyzePath(dirPath).exists) {
                        fs.mkdirSync(dirPath, { recursive: true });
                    }

                    // Write file
                    fs.writeFile('/' + file, content);
                    loaded++;
                    log(`✓ ${file}`);
                } catch (e) {
                    failed++;
                    log(`✗ ${file}: ${e.message}`);
                }
            }

            log(`\n✓ Loaded ${loaded}/${files.length} files (${failed} failed)`);

            // Setup Python path
            await pyodide.runPythonAsync(`
import sys
sys.path.insert(0, '/')
print('Python path:', sys.path)
            `);

            log('\n✓ Python environment ready');
        }

        async function runTest() {
            output.textContent = '';

            try {
                if (!pyodide) {
                    await loadPyodide();
                }

                log('\n=== Testing Imports ===\n');

                // Test 1: Import constants
                log('Test 1: Import constants...');
                await pyodide.runPythonAsync(`
try:
    from src.constants import PHYSICS, VALIDATION_RANGES, MATERIAL_PRESETS, MACHINE_SPECS
    print('✓ Constants imported successfully')
    print(f'  MATERIAL_PRESETS keys: {list(MATERIAL_PRESETS.keys())}')
except Exception as e:
    print(f'✗ Constants import failed: {e}')
    import traceback
    traceback.print_exc()
                `);

                // Test 2: Import validation
                log('\nTest 2: Import validation...');
                await pyodide.runPythonAsync(`
try:
    from src.core.validation import validate_parameters
    print('✓ Validation imported successfully')
except Exception as e:
    print(f'✗ Validation import failed: {e}')
    import traceback
    traceback.print_exc()
                `);

                // Test 3: Import core modules
                log('\nTest 3: Import core modules...');
                await pyodide.runPythonAsync(`
try:
    from src.core.modules import pressure, thermal, flow, environmental
    print('✓ Core modules imported successfully')
except Exception as e:
    print(f'✗ Core modules import failed: {e}')
    import traceback
    traceback.print_exc()
                `);

                // Test 4: Import kinetics (optional)
                log('\nTest 4: Import kinetics (optional)...');
                await pyodide.runPythonAsync(`
try:
    from src.core.kinetics import (
        CureKinetics,
        CureKineticsParameters,
        CastroMacoskoModel,
        ViscosityConversionParameters,
        LumpedThermalModel,
        ThermalReactionParameters,
        FoamRiseModel,
        FoamKineticsParameters,
        calculate_processing_window,
        calculate_reactive_viscosity,
        calculate_exotherm_rise,
        predict_scorch_risk,
        calculate_foam_rise,
    )
    print('✓ Kinetics imported successfully')
except Exception as e:
    print(f'⚠ Kinetics import failed (optional): {e}')
                `);

                // Test 5: Import calculation_processor
                log('\nTest 5: Import calculation_processor...');
                const result = await pyodide.runPythonAsync(`
import importlib
import traceback

try:
    mod = importlib.import_module('src.core.processors.calculation_processor')
    print(f'✓ calculation_processor imported: {mod}')
    print(f'  Has calculate_all: {hasattr(mod, "calculate_all")}')
    'SUCCESS'
except ImportError as e:
    print(f'✗ ImportError: {e}')
    traceback.print_exc()
    f'FAILED: {e}'
except Exception as e:
    print(f'✗ Exception: {e}')
    traceback.print_exc()
    f'FAILED: {e}'
                `);

                log('\n' + result);

                // Test 6: Run calculation
                if (result === 'SUCCESS') {
                    log('\n=== Running Test Calculation ===\n');
                    const calcResult = await pyodide.runPythonAsync(`
from src.core.processors.calculation_processor import calculate_all
import json

params = {
    'pipe_length_mm': 500,
    'pipe_diameter_mm': 10,
    'material_key': 'ecofoam_standard',
    'temperature_c': 25,
    'flow_rate_lpm': 5,
    'machine_type': 'low_pressure'
}

result = calculate_all(params)
json.dumps({
    'success': result.get('success'),
    'errors': result.get('errors', []),
    'warnings': result.get('warnings', []),
    'has_data': 'data' in result
}, indent=2)
                    `);
                    log('Calculation result:');
                    log(calcResult);
                }

            } catch (e) {
                log('\n✗ ERROR: ' + e.message);
                console.error(e);
            }
        }
    </script>
</body>
</html>
