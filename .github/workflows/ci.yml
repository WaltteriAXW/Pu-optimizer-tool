name: CI

# Gate changes before they reach main. deploy.yml runs its own checks, but it only fires
# after a merge — by then a broken change is already deploying to GitHub Pages.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm test -- --run

      - name: Build
        run: npm run build

      # The end-to-end suite serves Pyodide from node_modules rather than the CDN, so it
      # needs no outbound network beyond the browser download itself.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  python:
    name: Physics engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # numpy and scikit-learn are what the suite actually needs. xgboost and
      # scikit-optimize from requirements.txt are optional at runtime and the code handles
      # their absence, so they are left out to keep the job fast and free of wheel builds.
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest numpy scikit-learn

      - name: Run tests
        run: pytest src -q
