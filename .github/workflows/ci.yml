name: CI

# Every check, and the deploy, in one workflow. The deploy used to live in its own file
# triggered on push to main, which meant it shipped without waiting for anything here — and
# ran neither the type check, the Python suite nor the end-to-end tests itself. It is now a
# job gated on both check jobs, so nothing reaches GitHub Pages that has not passed all of it.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm test -- --run

      - name: Build
        run: npm run build

      # The end-to-end suite serves Pyodide from node_modules rather than the CDN, so it
      # needs no outbound network beyond the browser download itself.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Handed to the deploy job so the bytes that ship are the bytes the suite above ran
      # against, rather than a second build merely expected to match.
      - name: Upload build output
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          include-hidden-files: true
          retention-days: 1

  python:
    name: Physics engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # numpy and scikit-learn are what the suite actually needs. xgboost and
      # scikit-optimize from requirements.txt are optional at runtime and the code handles
      # their absence, so they are left out to keep the job fast and free of wheel builds.
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest numpy scikit-learn

      - name: Run tests
        run: pytest src -q

  deploy:
    name: Deploy to GitHub Pages
    needs: [node, python]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download build output
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages

      # Replaces actions/create-release@v1, which is archived and still on the Node 12
      # runtime. gh is preinstalled on the runner, so this needs no third-party action.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}-$(date +%s)"
          NOTES=$(printf '%s\n\n%s\n' \
            "Deployed from ${GITHUB_SHA} to https://waltteraxw.github.io/Pu-optimizer-tool/" \
            "Earlier versions are on the [releases page](https://github.com/${GITHUB_REPOSITORY}/releases).")
          gh release create "$TAG" --title "Release v${VERSION}" --notes "$NOTES"
